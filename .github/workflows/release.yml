name: release

# Push a tag vX.Y.Z to publish a GitHub release. The tag must match the
# plugin version and the CHANGELOG must have a section for it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version and extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          plugin=$(jq -r .version plugins/telegram/.claude-plugin/plugin.json)
          if [ "$plugin" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $plugin" >&2
            exit 1
          fi
          scripts/changelog-section.sh "$version" > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "No CHANGELOG section for $version" >&2; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
