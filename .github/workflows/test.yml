name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/telegram
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit --production --audit-level=moderate
      - name: Shell scripts
        run: for f in ../../scripts/*.sh; do bash -n "$f"; done
      - name: Type check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun test lib/
      - name: End-to-end tests
        run: bun test test/
      - name: Syntax check
        run: |
          for f in server.ts router.ts core/*.ts hooks/*.ts helpers/*.ts; do
            bun build "$f" --target=bun --outdir "$RUNNER_TEMP/build" > /dev/null
          done
